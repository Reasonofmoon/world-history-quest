<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세계사 익힘 탐험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a field notebook. Sticky top bar, one column of working cards, max 860px; the lesson is a stepper. */
:root{
  --bg:#edf1f1; --surface:#ffffff; --ink:#13222b; --muted:#56666f; --line:#c9d3d6;
  --accent:#0c7566; --accent-ink:#ffffff; --seal:#c8402a; --gold:#b98312; --soft:#dfeceA;
  --ok:#1f7a3d; --bad:#b3261e;
  --display:'Gowun Batang','Noto Serif KR',serif; --body:'IBM Plex Sans KR','Noto Sans KR',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e161a; --surface:#172329; --ink:#e7eff1; --muted:#9fb0b7; --line:#2c3d45;
  --accent:#45c4ab; --accent-ink:#06211c; --seal:#ff8163; --gold:#e3b345; --soft:#1d3531;
  --ok:#62d08a; --bad:#ff8a80; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e161a; --surface:#172329; --ink:#e7eff1; --muted:#9fb0b7; --line:#2c3d45;
  --accent:#45c4ab; --accent-ink:#06211c; --seal:#ff8163; --gold:#e3b345; --soft:#1d3531;
  --ok:#62d08a; --bad:#ff8a80; color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.3}
a{color:var(--accent)}
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:1.15rem;margin-right:auto;background:none;border:0;padding:0}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:.88rem}
.nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.xp{font-variant-numeric:tabular-nums;font-weight:700;color:var(--gold);font-size:.92rem;white-space:nowrap}
main{max-width:860px;margin:0 auto;padding:18px 16px 80px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.hero{display:grid;grid-template-columns:170px 1fr;gap:18px;align-items:center}
.hero canvas{width:170px;height:170px}
.hero h1{font-size:1.7rem}
.hero p{margin:6px 0 0;color:var(--muted)}
.morphcap{font-size:.82rem;color:var(--accent);font-weight:700;letter-spacing:.04em;min-height:1.4em}
.bar{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .6s}
.part h2{font-size:1.1rem;display:flex;gap:8px;align-items:baseline}
.part h2 b{color:var(--seal);font-size:1.3rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:10px}
.les{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.les:hover{border-color:var(--accent)}
.les .n{font-family:var(--display);font-weight:700;color:var(--seal);font-size:1.25rem;font-variant-numeric:tabular-nums}
.les .t{font-weight:700;line-height:1.35}
.dots{display:flex;gap:4px;margin-top:auto}
.dots i{width:14px;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--accent)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:.78rem;color:var(--muted);white-space:nowrap}
.chip.done{border-color:var(--ok);color:var(--ok);font-weight:700}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.steps button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:.9rem}
.steps button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.steps button.ok::after{content:" ✓";color:var(--ok);font-weight:700}
.steps button[aria-selected="true"].ok::after{color:var(--gold)}
.lhead{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.lhead .n{font-family:var(--display);font-size:2.6rem;font-weight:700;color:var(--seal);line-height:1}
.lhead h1{font-size:1.45rem}
.lhead small{color:var(--muted)}
.key{border-left:4px solid var(--accent);background:var(--soft);padding:10px 12px;border-radius:0 8px 8px 0}
.sum h3{font-size:1rem;margin:14px 0 6px;border-bottom:2px solid var(--ink);padding-bottom:3px}
.sum li{margin:0 0 8px;line-height:2.1}
.sum ul{margin:0;padding-left:20px}
.blk{border:0;border-bottom:2px solid var(--ink);background:var(--soft);border-radius:4px 4px 0 0;padding:1px 4px;text-align:center;font-weight:700;min-width:3em}
.blk.ok{background:transparent;color:var(--ok);border-color:var(--ok)}
.blk.no{color:var(--bad);border-color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.btn{border:1px solid var(--ink);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:700}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:var(--line);font-weight:500}
.btn:disabled{opacity:.45;cursor:default}
.flip{perspective:1000px;height:210px}
.flip .inr{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;border:0;background:none;padding:0}
.flip .inr.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border:2px solid var(--ink);border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;padding:18px;text-align:center}
.face.f{font-family:var(--display);font-size:1.7rem;font-weight:700}
.face.b{transform:rotateY(180deg);background:var(--soft);font-size:1.05rem}
.big{font-family:var(--display);font-size:1.25rem;font-weight:700;line-height:1.5}
.oxb{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.oxb button{font-family:var(--display);font-size:2.2rem;font-weight:700;padding:14px;border-radius:12px;border:2px solid var(--ink);background:var(--surface)}
.fb{margin-top:12px;padding:10px 12px;border-radius:8px;border:1px solid var(--line)}
.fb.ok{border-color:var(--ok)}.fb.no{border-color:var(--bad)}
.fb b.ok{color:var(--ok)}.fb b.no{color:var(--bad)}
.tok{border:1px solid var(--ink);background:var(--surface);border-radius:8px;padding:7px 11px;text-align:left}
.tok.sel{opacity:.3}
.slot{min-height:54px;border:2px dashed var(--line);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;margin-top:7px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.r{border-color:var(--ok);background:var(--soft);font-weight:700}
.opt.w{border-color:var(--bad)}
.qbox{border:1px solid var(--ink);border-radius:6px;padding:9px 12px;margin:8px 0;font-size:.95rem;background:var(--bg)}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);resize:vertical}
input[type=text],input[type=number]{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--bg);max-width:100%}
.rub label{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-top:1px solid var(--line)}
.muted{color:var(--muted);font-size:.9rem}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.flow span{border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:.88rem;transition:all .35s}
.flow span.on{background:var(--seal);color:#fff;border-color:var(--seal);transform:translateY(-3px)}
.flow em{font-style:normal;color:var(--muted)}
.tlwrap{overflow-x:auto}
.tl{display:flex;gap:10px;padding:8px 2px 12px;min-width:max-content}
.ev{flex:0 0 150px;border:1px solid var(--line);border-top:5px solid var(--accent);border-radius:8px;padding:9px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:4px}
.ev.w{border-top-color:var(--gold)}.ev.u{border-top-color:var(--seal)}
.ev b{font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.ev.hide span{filter:blur(6px)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.85rem}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg text{fill:var(--ink);font-family:var(--body)}
.viz{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{border-radius:8px;padding:10px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--line);padding:6px 8px;text-align:left;font-size:.92rem;vertical-align:top}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
@media (max-width:560px){.hero{grid-template-columns:1fr}.hero canvas{margin:0 auto}.two{grid-template-columns:1fr}.lhead .n{font-size:2rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <button class="brand" data-go="home">세계사 익힘 탐험</button>
  <nav class="nav" aria-label="화면">
    <button data-go="home" id="nav-home">차시 지도</button>
    <button data-go="timeline" id="nav-timeline">연표</button>
    <button data-go="tests" id="nav-tests">종합 평가</button>
    <button data-go="exam" id="nav-exam">시험 대비</button>
    <button data-go="wrong" id="nav-wrong">오답 노트</button>
    <button data-go="lab" id="nav-lab">기억법 실험실</button>
    <button data-go="class" id="nav-class">우리 반</button>
  </nav>
  <span class="xp" id="xp" title="경험치">0 XP</span>
</div></header>
<main id="app"><div class="card">학습 자료를 불러오는 중입니다.</div></main>
<canvas id="fx"></canvas>
<script>
'use strict';
function blank(){return {done:{},xp:0,wrong:[],mn:{},yr:{},tests:{},res:{},nick:'',mock:null,board:{}}}
var D=null, S=blank(), ui={}, timers=[];
var STEPS=[['sum','핵심 정리'],['card','용어 카드'],['ox','○× 퀴즈'],['order','순서 세우기'],['mcq','실전 문항'],['essay','서술형'],['mn','기억법'],['video','영상']];
var CORE=['sum','card','ox','order','mcq','essay'];
var C='①②③④⑤';
function load(){try{var t=localStorage.getItem('hist1-progress');if(t){var o=JSON.parse(t);for(var k in o)S[k]=o[k];}}catch(e){}}
function save(){try{localStorage.setItem('hist1-progress',JSON.stringify(S));}catch(e){}queueCloud()}
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pad(n){return (n<10?'0':'')+n}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function norm(s){return String(s).replace(/[\s·.,]/g,'').toLowerCase()}
function L(no){return D.lessons[no-1]}
function isDone(no,st){return !!(S.done[no]&&S.done[no][st])}
function mark(no,st,xp){if(!S.done[no])S.done[no]={};if(!S.done[no][st]){S.done[no][st]=1;S.xp+=(xp||10);save();showXP();var all=CORE.every(function(c){return S.done[no][c]});if(all)burst();}}
function showXP(){$('#xp').textContent=S.xp+' XP'}
function clearTimers(){timers.forEach(function(t){clearInterval(t)});timers=[]}
function go(h){if(location.hash==='#'+h)route();else location.hash=h}
function route(){
  clearTimers();
  var h=(location.hash||'#home').slice(1), m=/^lesson-(\d+)$/.exec(h), app=$('#app');
  ['home','timeline','tests','wrong','lab','exam','class'].forEach(function(k){var b=$('#nav-'+k);if(h===k)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  if(m&&L(+m[1]))viewLesson(+m[1]);
  else if(h==='timeline')viewTimeline();
  else if(h==='tests')viewTests();
  else if(h==='wrong')viewWrong();
  else if(h==='lab')viewLab();
  else if(h==='exam')viewExam();
  else if(h==='class')viewClass();
  else viewHome();
  window.scrollTo(0,0);
}
/* ---------- home ---------- */
function viewHome(){
  var tot=D.lessons.length*CORE.length, got=0;
  D.lessons.forEach(function(l){CORE.forEach(function(c){if(isDone(l.no,c))got++})});
  var next=D.lessons.filter(function(l){return !CORE.every(function(c){return isDone(l.no,c)})})[0]||D.lessons[0];
  var h='<section class="card hero"><div><canvas id="morph" width="340" height="340" aria-hidden="true"></canvas><div class="morphcap" id="morphcap" style="text-align:center"></div></div><div>'+
    '<h1>송의 건국부터 신해혁명까지, 19차시</h1><p>차시마다 핵심 정리, 용어 카드, ○× 퀴즈, 순서 세우기, 실전 문항, 서술형을 차례로 풉니다. 시험 대비 화면에서 범위 전체를 요소별로 점검하고 모의고사를 볼 수 있습니다.</p>'+
    '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+tot+'" aria-valuenow="'+got+'"><i id="pbar"></i></div><p class="muted">'+got+' / '+tot+' 활동 완료</p>'+
    '<div class="row"><button class="btn pri" data-go="lesson-'+pad(next.no)+'">'+(got?'이어서 하기':'시작하기')+': '+pad(next.no)+' '+esc(next.title)+'</button></div></div></section>';
  D.parts.forEach(function(p,i){
    h+='<section class="part"><h2><b>'+p.r+'</b>'+esc(p.t)+'</h2><div class="grid">';
    D.lessons.filter(function(l){return l.part===i}).forEach(function(l){
      var dn=CORE.filter(function(c){return isDone(l.no,c)}).length;
      h+='<button class="les" data-go="lesson-'+pad(l.no)+'"><span class="n">'+pad(l.no)+'</span><span class="t">'+esc(l.title)+'</span>'+
        '<span>'+(dn===CORE.length?'<span class="chip done">완료</span>':'<span class="chip">'+dn+' / '+CORE.length+'</span>')+'</span>'+
        '<span class="dots">'+CORE.map(function(c){return '<i class="'+(isDone(l.no,c)?'on':'')+'"></i>'}).join('')+'</span></button>';
    });
    h+='</div></section>';
  });
  h+='<section class="card"><div class="row" style="margin:0"><span class="muted">학습 기록은 이 기기의 브라우저에만 저장됩니다.</span><button class="btn ghost" id="reset" style="margin-left:auto">기록 지우기</button></div></section>';
  $('#app').innerHTML=h;
  setTimeout(function(){var b=$('#pbar');if(b)b.style.width=(100*got/tot)+'%'},50);
  morph();
  var armed=false;$('#reset').onclick=function(){if(!armed){armed=true;this.textContent='한 번 더 누르면 모두 지워집니다';return}S=blank();save();showXP();viewHome()};
}
/* morphing loop: one outline that turns from one era's emblem into the next */
var SHAPES=[
  ['나침반 · 신항로 개척',function(t){return .42+.58*Math.pow(Math.abs(Math.cos(2*t)),3.2)}],
  ['톱니바퀴 · 산업 혁명',function(t){return .78+.2*(Math.cos(12*t)>0?1:-1)*Math.min(1,Math.abs(Math.cos(12*t))*3)}],
  ['여덟 꼭지 별 · 이슬람 문양',function(t){return .62+.38*Math.pow(Math.abs(Math.cos(4*t)),.7)}],
  ['동전과 교자 · 송의 경제',function(t){return .92}],
  ['연꽃 · 무굴의 건축',function(t){return .55+.45*Math.abs(Math.sin(3*t))}],
  ['삼각 무역 · 대서양',function(t){var a=((t+Math.PI/2)%(2*Math.PI/3)+2*Math.PI/3)%(2*Math.PI/3)-Math.PI/3;return .5/Math.cos(a)}]];
function morph(){
  var cv=$('#morph');if(!cv)return;var x=cv.getContext('2d'),cap=$('#morphcap'),t0=performance.now(),N=240,still=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function col(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
  function frame(now){
    if(!document.body.contains(cv))return;
    var T=still?0:(now-t0)/2600, i=Math.floor(T)%SHAPES.length, j=(i+1)%SHAPES.length, f=T-Math.floor(T), e=f<.6?0:(f-.6)/.4; e=e*e*(3-2*e);
    x.clearRect(0,0,340,340);x.save();x.translate(170,170);x.rotate(still?0:T*.25);
    x.beginPath();
    for(var k=0;k<=N;k++){var th=k/N*Math.PI*2, r=(SHAPES[i][1](th)*(1-e)+SHAPES[j][1](th)*e)*135;x[k?'lineTo':'moveTo'](Math.cos(th)*r,Math.sin(th)*r)}
    x.closePath();x.fillStyle=col('--soft');x.fill();x.lineWidth=5;x.strokeStyle=col('--accent');x.stroke();
    x.beginPath();x.arc(0,0,14,0,7);x.fillStyle=col('--seal');x.fill();x.restore();
    cap.textContent=SHAPES[e>.5?j:i][0];
    if(!still)requestAnimationFrame(frame);
  }
  frame(performance.now());
}
/* ---------- lesson ---------- */
function viewLesson(no,step){
  clearTimers();
  var l=L(no);step=step||ui.step||'sum';ui.step=step;ui.no=no;
  var h='<section class="card"><div class="lhead"><span class="n">'+pad(no)+'</span><div><small>'+D.parts[l.part].r+'. '+esc(D.parts[l.part].t)+' · 교과서 '+esc(l.pages)+'쪽</small><h1>'+esc(l.title)+'</h1></div></div>'+
    '<div class="steps" role="tablist" style="margin-top:12px">'+STEPS.map(function(s){return '<button role="tab" data-step="'+s[0]+'" aria-selected="'+(s[0]===step)+'" class="'+(isDone(no,s[0])?'ok':'')+'">'+s[1]+'</button>'}).join('')+'</div></section>'+
    '<section class="card" id="stage"></section>'+
    '<div class="row" style="margin:0">'+(no>1?'<button class="btn ghost" data-go="lesson-'+pad(no-1)+'">← '+pad(no-1)+' 차시</button>':'')+(no<D.lessons.length?'<button class="btn ghost" style="margin-left:auto" data-go="lesson-'+pad(no+1)+'">'+pad(no+1)+' 차시 →</button>':'')+'</div>';
  $('#app').innerHTML=h;
  ({sum:stSum,card:stCard,ox:stOX,order:stOrder,mcq:stMCQ,essay:stEssay,mn:stMn,video:stVideo})[step](l,$('#stage'));
}
function nextBtn(no,st){var i=STEPS.findIndex(function(s){return s[0]===st});return i<STEPS.length-1?'<button class="btn pri" data-step="'+STEPS[i+1][0]+'">다음: '+STEPS[i+1][1]+' →</button>':''}
function stSum(l,el){
  var ans=[], h='<div class="key"><b>오늘의 핵심</b> '+esc(l.key)+'</div><p class="muted" style="margin:10px 0 0">빈칸에 알맞은 말을 써 넣고 채점합니다. 막히면 낱말 창고를 엽니다.</p><div class="sum">';
  l.summary.forEach(function(sec){h+='<h3>'+esc(sec[0])+'</h3><ul>'+sec[1].map(function(line){return '<li>'+esc(line).replace(/\[\[(.+?)\]\]/g,function(_,a){ans.push(a);return '<input class="blk" id="b'+(ans.length-1)+'" type="text" autocomplete="off" aria-label="빈칸 '+ans.length+'" style="width:'+Math.max(3.4,a.length*1.15+1.2)+'em">'})+'</li>'}).join('')+'</ul>'});

  if(!rows.length)return '<p class="muted">아직 모인 진도가 없습니다.</p>';
  rows=rows.slice().sort(function(a,b){return String(a.nick).localeCompare(String(b.nick),'ko')});
  return '<div style="overflow-x:auto"><table style="min-width:720px"><tr><th>번호 · 별명</th><th>차시별 진도 (01~19)</th><th>평가 1</th><th>평가 2</th><th>모의</th><th>오답</th><th>XP</th></tr>'+rows.map(function(r){
    return '<tr><td><b>'+esc(r.nick||'이름 없음')+'</b><br><span class="muted" style="font-size:.75rem">'+(r.src==='auto'?'자동':'코드')+(r.ts?' · '+new Date(r.ts).toLocaleDateString('ko-KR'):'')+'</span></td><td><span style="display:inline-flex;gap:2px">'+String(r.d).split('').map(function(c,i){var v=+c/6;return '<span title="'+pad(i+1)+'차시 '+c+'/6" style="width:14px;height:22px;border-radius:3px;border:1px solid var(--line);background:'+(v?'var(--accent)':'transparent')+';opacity:'+(v?(.3+.7*v):1)+'"></span>'}).join('')+'</span></td>'+
      '<td>'+(r.t1<0?'–':r.t1+' / 10')+'</td><td>'+(r.t2<0?'–':r.t2+' / 10')+'</td><td>'+(r.mock<0?'–':r.mock+' / 20')+'</td><td>'+r.wrong+'</td><td>'+r.xp+'</td></tr>'}).join('')+'</table></div>'+
    '<p class="muted">칸이 진할수록 그 차시의 여섯 활동을 많이 마친 것입니다. 반 평균 진도: '+(rows.reduce(function(s,r){return s+String(r.d).split('').reduce(function(a,c){return a+ +c},0)},0)/(rows.length*114)*100).toFixed(0)+'%</p>';
}
function viewClass(){
  var h='<section class="card"><h1 style="font-size:1.4rem">우리 반</h1><p class="muted">내 진도를 선생님께 보내고, 선생님은 반 전체 진도를 한 표로 봅니다. 실명 대신 번호나 별명을 쓰세요.</p></section>'+
    '<section class="card"><h2>내 진도 보내기</h2><div class="row"><label for="nick">번호 · 별명</label><input type="text" id="nick" maxlength="20" value="'+esc(S.nick||'')+'" placeholder="예: 2반 17번"><button class="btn" id="nsv">저장</button></div><p class="muted" id="syncmsg">'+syncText()+'</p>'+
    '<div class="row"><button class="btn pri" id="cp">내 진도 코드 복사</button><span class="muted" id="cpm"></span></div><textarea id="codebox" readonly aria-label="내 진도 코드" style="min-height:70px;margin-top:8px;font-size:.8rem" hidden></textarea></section>'+
    '<section class="card"><h2>선생님 화면</h2><p class="muted">학생이 보낸 진도 코드를 여러 개 한꺼번에 붙여 넣을 수 있습니다. 같은 번호·별명은 최신 것으로 바뀝니다. 붙여 넣은 진도는 이 기기에 저장됩니다.</p><textarea id="paste" aria-label="진도 코드 붙여 넣기" placeholder="H1. 으로 시작하는 코드를 붙여 넣으세요." style="min-height:80px"></textarea><div class="row"><button class="btn" id="addc">표에 추가</button><button class="btn ghost" id="clrb">표 비우기</button><button class="btn ghost" id="reload"'+(cloud.edit?'':' hidden')+'>자동 전송분 새로 고침</button><span class="muted" id="bm"></span></div><div id="board" style="margin-top:12px"></div></section>';
  $('#app').innerHTML=h;
  var auto=[];
  function draw(){var rows=Object.keys(S.board||{}).map(function(k){var r=S.board[k];r.src='code';return r}).concat(auto);$('#board').innerHTML=boardTable(rows)}
  function pull(){if(!cloud.db||!cloud.edit)return;$('#bm').textContent='불러오는 중입니다.';var done=false,tm=setTimeout(function(){if(!done)$('#bm').textContent='자동 전송분을 아직 불러오지 못했습니다.'},10000);
    cloud.db.collection('progress').limit(500).get().then(function(q){done=true;clearTimeout(tm);auto=q.docs.map(function(d){var x=d.data()||{};return {nick:String(x.nick||'').slice(0,20),xp:+x.xp||0,d:/^\d{19}$/.test(String(x.d))?String(x.d):'0000000000000000000',t1:x.t1==null?-1:+x.t1,t2:x.t2==null?-1:+x.t2,mock:x.mock==null?-1:+x.mock,wrong:+x.wrong||0,ts:+x.ts||0,src:'auto'}});$('#bm').textContent='자동 전송 '+auto.length+'명';draw()},function(){done=true;clearTimeout(tm);$('#bm').textContent='자동 전송분을 불러오지 못했습니다.'})}
  draw();pull();
  $('#nsv').onclick=function(){S.nick=$('#nick').value.trim().slice(0,20);save();$('#syncmsg').textContent=syncText()};
  $('#cp').onclick=function(){S.nick=$('#nick').value.trim().slice(0,20);save();var c=myCode(),box=$('#codebox');box.hidden=false;box.value=c;
    try{navigator.clipboard.writeText(c).then(function(){$('#cpm').textContent='복사했습니다. 선생님께 붙여 보내세요.'},function(){$('#cpm').textContent='아래 코드를 길게 눌러 복사하세요.';box.select()})}catch(e){$('#cpm').textContent='아래 코드를 길게 눌러 복사하세요.';box.select()}};
  $('#addc').onclick=function(){var rs=parseCodes($('#paste').value);if(!rs.length){$('#bm').textContent='읽을 수 있는 코드가 없습니다. H1. 으로 시작하는지 확인하세요.';return}if(!S.board)S.board={};rs.forEach(function(r){var k=r.nick||('이름 없음 '+r.ts);if(!S.board[k]||S.board[k].ts<=r.ts)S.board[k]=r});save();$('#paste').value='';$('#bm').textContent=rs.length+'명을 추가했습니다.';draw()};
  var armed=false;$('#clrb').onclick=function(){if(!armed){armed=true;this.textContent='한 번 더 누르면 비워집니다';return}S.board={};save();viewClass()};
  $('#reload').onclick=pull;
}
/* ---------- confetti ---------- */
function burst(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var cv=$('#fx'),x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  var cs=['#0c7566','#c8402a','#b98312','#45c4ab'],ps=[];for(var i=0;i<90;i++)ps.push({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*12-3,c:cs[i%4],s:4+Math.random()*6,r:Math.random()*6});
  var n=0;(function f(){x.clearRect(0,0,cv.width,cv.height);ps.forEach(function(p){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++n<110)requestAnimationFrame(f);else x.clearRect(0,0,cv.width,cv.height)})();
}
/* ---------- wiring ---------- */
document.addEventListener('click',function(e){var b=e.target.closest('[data-go]');if(b){go(b.dataset.go);return}var s=e.target.closest('[data-step]');if(s&&ui.no){ui.step=s.dataset.step;viewLesson(ui.no,ui.step)}});
window.addEventListener('hashchange',function(){ui.step='sum';route()});
load();showXP();initCloud(0);
fetch('data.json').then(function(r){return r.json()}).then(function(j){D=j[0];route()}).catch(function(){$('#app').innerHTML='<div class="card">학습 자료를 불러오지 못했습니다. 페이지를 새로 고쳐 주세요.</div>'});
</script>
